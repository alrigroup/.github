<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" fill="none">
  <style>
    .header { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FF0000; }
    .sub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F0F6FC; }
    .legend-title { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F0F6FC; }
    .legend-pct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E; }
    .stat-title { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E; }
    .stat-num { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F0F6FC; }
    .border { stroke: #30363D; stroke-width: 1; }
  </style>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="519" height="259" rx="8" fill="#0D1117" class="border"/>

  <!-- Red Accent Top Line -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 512 0 C 516.42 0 520 3.58 520 8 L 520 4 L 0 4 Z" fill="#FF0000"/>

  <!-- Header -->
  <g transform="translate(25, 34)">
    <text x="0" y="0" class="header">ALRI GROUP</text>
    <text x="120" y="0" class="sub">• GitHub Organization Metrics</text>
  </g>

  <!-- GitHub Metrics Grid (Exact values) -->
  <g transform="translate(25, 54)">
    <!-- Repositories -->
    <rect x="0" y="0" width="108" height="52" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="12" y="20" class="stat-title">Repositories</text>
    <text x="12" y="42" class="stat-num">12</text>

    <!-- Total Stars -->
    <rect x="120" y="0" width="108" height="52" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="132" y="20" class="stat-title">Total Stars</text>
    <text x="132" y="42" class="stat-num">5 ⭐</text>

    <!-- Forks -->
    <rect x="240" y="0" width="108" height="52" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="252" y="20" class="stat-title">Forks</text>
    <text x="252" y="42" class="stat-num">1 🍴</text>

    <!-- Followers -->
    <rect x="360" y="0" width="110" height="52" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="372" y="20" class="stat-title">Followers</text>
    <text x="372" y="42" class="stat-num">2 👥</text>
  </g>

  <!-- Languages Section Header -->
  <g transform="translate(25, 134)">
    <text x="0" y="0" class="label">Most Used Languages Across All Repositories</text>
  </g>

  <!-- Progress Bar (470px width) -->
  <g transform="translate(25, 146)">
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="470" height="10" rx="5"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <!-- C: 75.0% = 352.5px -->
      <rect x="0" y="0" width="352" height="10" fill="#555555"/>
      <!-- Batchfile: 7.3% = 34.3px -->
      <rect x="352" y="0" width="35" height="10" fill="#C1F12E"/>
      <!-- JavaScript: 5.7% = 26.8px -->
      <rect x="387" y="0" width="27" height="10" fill="#f1e05a"/>
      <!-- HTML: 4.1% = 19.3px -->
      <rect x="414" y="0" width="19" height="10" fill="#e34c26"/>
      <!-- CSS: 3.0% = 14.1px -->
      <rect x="433" y="0" width="14" height="10" fill="#563d7c"/>
      <!-- Others: 4.9% = 23px -->
      <rect x="447" y="0" width="23" height="10" fill="#2b7489"/>
    </g>
  </g>

  <!-- Languages Legend: Line 1 -->
  <g transform="translate(25, 178)">
    <circle cx="5" cy="5" r="5" fill="#555555"/>
    <text x="16" y="9" class="legend-title">C</text>
    <text x="32" y="9" class="legend-pct">75.0%</text>

    <circle cx="160" cy="5" r="5" fill="#C1F12E"/>
    <text x="171" y="9" class="legend-title">Batchfile</text>
    <text x="232" y="9" class="legend-pct">7.3%</text>

    <circle cx="320" cy="5" r="5" fill="#f1e05a"/>
    <text x="331" y="9" class="legend-title">JavaScript</text>
    <text x="403" y="9" class="legend-pct">5.7%</text>
  </g>

  <!-- Languages Legend: Line 2 -->
  <g transform="translate(25, 203)">
    <circle cx="5" cy="5" r="5" fill="#e34c26"/>
    <text x="16" y="9" class="legend-title">HTML</text>
    <text x="56" y="9" class="legend-pct">4.1%</text>

    <circle cx="160" cy="5" r="5" fill="#563d7c"/>
    <text x="171" y="9" class="legend-title">CSS</text>
    <text x="202" y="9" class="legend-pct">3.0%</text>

    <circle cx="320" cy="5" r="5" fill="#2b7489"/>
    <text x="331" y="9" class="legend-title">Other (C++, PS)</text>
    <text x="434" y="9" class="legend-pct">4.9%</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(25, 242)">
    <text x="0" y="0" class="sub" font-size="10px">⚡ Automated GitHub Organization Telemetry</text>
  </g>
</svg>
