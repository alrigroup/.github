name: Metrics
on:
  # Schedule updates daily at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allows running manually from the Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Organization Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alrigroup
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          filename: profile/github-metrics.svg

          # Languages Plugin
          plugin_languages: yes
          plugin_languages_analysis_limit: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Output
          committer_message: "chore: update organization metrics [skip ci]"
